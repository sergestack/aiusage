[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aiusage"
dynamic = ["version"]
description = "One terminal dashboard for the usage / limits of Claude Code, OpenAI Codex (multiple accounts) and Grok."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["tomli>=1.1; python_version < '3.11'"]
keywords = ["claude", "codex", "grok", "usage", "rate-limits", "cli", "dashboard"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/sergestack/aiusage"
Issues = "https://github.com/sergestack/aiusage/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
aiusage = "aiusage.cli:main"

[tool.setuptools]
packages = ["aiusage", "aiusage.providers"]

[tool.setuptools.dynamic]
version = { attr = "aiusage.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
